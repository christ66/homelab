apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-imap-mail
  namespace: mailbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 150Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: local-imap-users
  namespace: mailbox
type: Opaque
stringData:
  users: |
    test:{PLAIN}changeme
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-imap-dovecot-config
  namespace: mailbox
data:
  dovecot.conf: |
    protocols = imap
    listen = *

    ssl = no
    disable_plaintext_auth = no
    auth_mechanisms = plain login

    mail_location = maildir:/mail/%u/Maildir
    mail_uid = 5000
    mail_gid = 5000
    first_valid_uid = 1

    passdb {
      driver = passwd-file
      args = scheme=PLAIN username_format=%u /etc/dovecot/users
    }

    userdb {
      driver = static
      args = uid=5000 gid=5000 home=/mail/%u
    }

    namespace inbox {
      type = private
      separator = /
      prefix =
      inbox = yes

      mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
      }

      mailbox Sent {
        special_use = \Sent
        auto = subscribe
      }

      mailbox Trash {
        special_use = \Trash
        auto = subscribe
      }

      mailbox Junk {
        special_use = \Junk
        auto = subscribe
      }

      mailbox Archive {
        special_use = \Archive
        auto = subscribe
      }
    }

    service imap-login {
      inet_listener imap {
        port = 143
      }

      inet_listener imaps {
        port = 0
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-imap
  namespace: mailbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: local-imap
  template:
    metadata:
      labels:
        app: local-imap
    spec:
      securityContext:
        fsGroup: 5000
      containers:
        - name: dovecot
          image: dovecot/dovecot:latest
          ports:
            - containerPort: 143
          volumeMounts:
            - name: config
              mountPath: /etc/dovecot/dovecot.conf
              subPath: dovecot.conf
            - name: users
              mountPath: /etc/dovecot/users
              subPath: users
            - name: mail
              mountPath: /mail
          readinessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: local-imap-dovecot-config
        - name: users
          secret:
            secretName: local-imap-users
        - name: mail
          persistentVolumeClaim:
            claimName: local-imap-mail
---
apiVersion: v1
kind: Service
metadata:
  name: local-imap
  namespace: mailbox
spec:
  type: ClusterIP
  selector:
    app: local-imap
  ports:
    - name: imap
      port: 143
      targetPort: 143
